<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סרטון ICEMAN</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 { color: #2c3e50; margin-bottom: 1rem; }
        p { color: #7f8c8d; font-size: 1.1rem; line-height: 1.6; margin: 5px 0; }
        
        .message-box {
            background-color: #e8f4fd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-right: 5px solid #3498db;
            text-align: right;
            width: 100%;
        }

        .file-info {
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px dashed #bdc3c7;
            width: 100%;
        }

        .btn-main {
            padding: 12px 25px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.3s;
            margin-top: 10px;
        }
        
        #runaway-btn {
            position: absolute;
            transition: all 0.1s ease;
            white-space: nowrap;
            z-index: 100;
        }

        input {
            padding: 10px;
            font-size: 1.2rem;
            width: 80%;
            margin: 1rem 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div id="content">
        <h1>היי קורן,</h1>
        <div class="message-box">
            <p><strong>הודעה מעמית:</strong></p>
            <p>״הסרטון שלך מוכן״</p>
        </div>
        <div class="file-info">
            <p>שם הקובץ: <strong>IcemanVideo.mp4</strong></p>
        </div>
        <p>תועבר ללינק בעוד שניות אחדות...</p>
        <p>יש לעבור את המבחן קודם.</p>
        <br>
        <button class="btn-main" onclick="startTest()">התחל מבחן</button>
    </div>
</div>

<script>
    let currentStep = 0;
    let clickCount = 0;
    const finalLink = "https://sendgb.com/CVIz7DeEWS6";
    const content = document.getElementById('content');
    
    let keysPressed = {};

    document.addEventListener('keydown', (event) => {
        keysPressed[event.key] = true;
        if (keysPressed['k'] && keysPressed['f']) {
            skipStep();
        }
    });

    document.addEventListener('keyup', (event) => {
        delete keysPressed[event.key];
    });

    function skipStep() {
        currentStep++;
        updateStep();
    }

    function startTest() {
        currentStep = 1;
        updateStep();
    }

    // פונקציה שמחזירה להתחלה בכל טעות
    function restartTest() {
        currentStep = 0;
        clickCount = 0;
        content.innerHTML = `
            <h1>היי קורן,</h1>
            <div class="message-box">
                <p><strong>הודעה מעמית:</strong></p>
                <p>״הסרטון שלך מוכן״</p>
            </div>
            <div class="file-info">
                <p>שם הקובץ: <strong>IcemanVideo.mp4</strong></p>
            </div>
            <p>תועבר ללינק בעוד שניות אחדות...</p>
            <p>יש לעבור את המבחן קודם.</p>
            <br>
            <button class="btn-main" onclick="startTest()">התחל מבחן</button>
        `;
    }

    function updateStep() {
        content.innerHTML = '';
        
        if (currentStep === 1) {
            content.innerHTML = `
                <h1>שלב 1</h1>
                <p>כמה זה 60 + 7?</p>
                <input type="number" id="ans1">
                <br><button class="btn-main" onclick="checkStep(1, '67')">אישור</button>
            `;
        } else if (currentStep === 2) {
            clickCount = 0;
            content.innerHTML = `
                <h1>שלב 2</h1>
                <p>לחץ על הכפתור כדי להמשיך (נשארו עוד: <span id="counter">67</span>)</p>
                <button class="btn-main" id="runaway-btn" onmouseover="handleHover()" onclick="handleClick()">הבא</button>
            `;
        } else if (currentStep === 3) {
            content.innerHTML = `
                <h1>שלב 3</h1>
                <p>צפה ב-67:</p>
                <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExcDJiam5meGRyMjQ5ZWQ0YzB5c2NyODZib3NyZW16d3czNXBnbjRodSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/08uBcURaMq6vA93TGc/giphy.gif" style="width:100%; border-radius:10px;">
                <p>הקש 67 לאישור צפייה:</p>
                <input type="text" id="ans3">
                <br><button class="btn-main" onclick="checkStep(3, '67')">המשך</button>
            `;
        } else if (currentStep === 4) {
            content.innerHTML = `
                <h1>שלב 4</h1>
                <p>מה המספר שמופיע פה? <b>סז</b></p>
                <input type="number" id="ans4">
                <br><button class="btn-main" onclick="checkStep(4, '67')">שלח</button>
            `;
        } else if (currentStep === 5) {
            content.innerHTML = `
                <h1>שלב 5</h1>
                <p>הקלד "67" הפוך:</p>
                <input type="text" id="ans5">
                <br><button class="btn-main" onclick="checkStep(5, '76')">בדיקה</button>
            `;
        } else if (currentStep === 6) {
            content.innerHTML = `
                <h1>שלב 6</h1>
                <p>כמה זה 134 חלקי 2?</p>
                <input type="number" id="ans6">
                <br><button class="btn-main" onclick="checkStep(6, '67')">סיום</button>
            `;
        } else if (currentStep > 6) {
            content.innerHTML = `
                <h1>הצלחת!</h1>
                <p>האימות הושלם בהצלחה.</p>
                <a href="${finalLink}"><button class="btn-main">מעבר ללינק</button></a>
            `;
        }
    }

    function handleHover() {
        const btn = document.getElementById('runaway-btn');
        if (!btn) return;
        const chance = Math.random();
        if (chance > 0.07) {
            const card = document.getElementById('main-card');
            const rect = card.getBoundingClientRect();
            const x = Math.random() * (rect.width - 100) - (rect.width / 2) + 50;
            const y = Math.random() * (rect.height - 100) - (rect.height / 2) + 50;
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }
    }

    function handleClick() {
        clickCount++;
        const counterEl = document.getElementById('counter');
        if (counterEl) counterEl.innerText = 67 - clickCount;
        if (clickCount >= 67) {
            currentStep++;
            updateStep();
        } else {
            const btn = document.getElementById('runaway-btn');
            btn.style.transform = `translate(0, 0)`;
        }
    }

    function checkStep(step, correct) {
        const input = document.getElementById('ans' + step);
        if (input && input.value.trim() === correct) {
            currentStep++;
            updateStep();
        } else {
            alert("טעות במבחן האימות. חוזרים להתחלה!");
            restartTest();
        }
    }
</script>

</body>
</html>
