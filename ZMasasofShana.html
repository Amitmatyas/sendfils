<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טוען את הקובץ שלך...</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌛</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa; /* רקע אפור בהיר מאוד, כמעט לבן */
            font-family: 'Heebo', sans-serif; /* שימוש בפונט Heebo */
            color: #2c3e50; /* צבע טקסט כהה יותר, נעים לעין */
            direction: rtl; /* כיוון טקסט מימין לשמאל לכל העמוד */
            text-align: center; /* יישור מרכזי של התוכן בתוך המלבן */
            overflow: hidden; /* מונע גלילה אם האנימציה יוצאת מגבולות המסך */
        }

        .loading-container {
            background-color: #ffffff; /* רקע לבן למלבן */
            border-radius: 12px; /* פינות מעוגלות */
            padding: 40px 60px; /* ריווח פנימי גדול יותר */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* צל עדין יותר ומודרני */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0; /* מתחיל שקוף לאנימציית דהייה */
            animation: fadeIn 0.8s forwards; /* אנימציית דהייה בכניסה */
            max-width: 90%; /* כדי שלא יהיה רחב מדי במסכים קטנים */
        }

        .loader-text {
            font-size: 2.8em; /* גודל פונט גדול יותר */
            font-weight: 700; /* עובי פונט מודגש יותר */
            margin-bottom: 15px;
            color: #34495e; /* צבע טקסט ראשי כהה יותר */
        }

        .small-text {
            font-size: 1.1em; /* גודל פונט גדול יותר לטקסט הקטן */
            color: #7f8c8d; /* אפור בינוני עדין */
        }

        .small-ttext {
            font-size: 1.8em; /* גודל פונט גדול יותר */
            color: #727e7e; /* אפור בטיפה יותר כהה */
        }

        .button-container {
            display: flex;
            gap: 20px; /* רווח בין הכפתורים */
            margin-top: 20px; /* רווח מעל הכפתורים */
        }

        .action-button {
            background-color: #3498db; /* כחול יפה לכפתורים */
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .action-button:hover {
            background-color: #2980b9; /* גוון כהה יותר בלחיצה */
            transform: translateY(-3px); /* אפקט ריחוף עדין */
        }

        /* אנימציית דהייה בכניסה */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* אנימציית דהייה ביציאה */
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="loading-container" id="loadingContainer">
        <div id="initialLoadingContent">
            <div class="loader-text">טוען את הקובץ שלך…</div>
            <div class="small-text">עמית מטיאס</div>
            <div class="small-ttext">מסע סוף שנה - כיתה ז</div>
        </div>

        <div id="countdownContent" style="display: none;">
            <div class="loader-text" id="deletionMessage"></div>
            <div class="small-text" id="countdownTimer"></div>
            <div class="button-container">
                <button class="action-button" id="actionButton">אישור</button>
            </div>
        </div>
    </div>

    <script>
        // תאריך היעד למחיקת הקובץ: 27 ביוני 2025, שעה 00:00:00 (חצות)
        // השתמש ב-'+03:00' כדי לציין את אזור הזמן של ישראל (IDT).
        const targetDate = new Date('2025-06-27T00:00:00+03:00');
        const redirectLink = ''; // **הכנס כאן את הלינק שלך**

        function updateCountdown() {
            const now = new Date();
            const timeLeft = targetDate.getTime() - now.getTime();

            const deletionMessageElement = document.getElementById('deletionMessage');
            const countdownTimerElement = document.getElementById('countdownTimer');
            const actionButton = document.getElementById('actionButton');

            if (timeLeft <= 0) {
                // אם התאריך עבר
                deletionMessageElement.textContent = 'הקובץ נמחק.'; // הקובץ נמחק.
                countdownTimerElement.textContent = ''; // נקה את הטיימר
                // אין צורך להפסיק את ה-setInterval כאן, הוא ימשיך לרוץ אך התוכן לא ישתנה.
            } else {
                // אם התאריך עוד לא הגיע
                const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                deletionMessageElement.textContent = 'הקובץ יימחק בעוד:'; // הקובץ יימחק בעוד:
                countdownTimerElement.textContent = `${days} ימים, ${hours} שעות, ${minutes} דקות, ${seconds} שניות`; // X ימים, Y שעות...
            }
        }

        // ודא שה-DOM נטען במלואו לפני הפעלת הסקריפט
        document.addEventListener('DOMContentLoaded', () => {
            const initialLoadingContent = document.getElementById('initialLoadingContent');
            const countdownContent = document.getElementById('countdownContent');
            const actionButton = document.getElementById('actionButton');

            // הוסף אירוע לחיצה לכפתור האישור
            actionButton.addEventListener('click', () => {
                window.location.href = redirectLink;
            });

            // המתן 3 שניות עבור מסך הטעינה הראשוני
            setTimeout(function() {
                // הסתר את תוכן הטעינה הראשוני
                initialLoadingContent.style.display = 'none';

                // הצג את תוכן הספירה לאחור והחל עליו אנימציית דהייה בכניסה
                countdownContent.style.display = 'flex'; // השתמש ב-flex למרכוז התוכן הפנימי שלו
                countdownContent.style.opacity = '0'; // התחל שקוף עבור אנימציית ה-fadeIn שלו
                countdownContent.style.animation = 'fadeIn 0.8s forwards'; // הפעל אנימציית דהייה בכניסה

                // עדכן את הספירה לאחור באופן מיידי ואז הגדר אינטרוול לעדכונים הבאים
                updateCountdown();
                setInterval(updateCountdown, 1000); // עדכן כל שנייה
            }, 3000); // השהיה של 3 שניות עבור מסך הטעינה הראשוני
        });
    </script>
</body>
</html>
