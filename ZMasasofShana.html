<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טוען את הקובץ שלך...</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌛</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            font-family: 'Heebo', sans-serif;
            color: #2c3e50;
            direction: rtl;
            text-align: center;
            overflow: hidden;
        }

        .loading-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px 60px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: fadeIn 0.8s forwards;
            max-width: 90%;
        }

        .loader-text {
            font-size: 2.2em;
            font-weight: 700;
            color: #34495e;
        }

        .small-text {
            font-size: 1.5em;
            color: #7f8c8d;
        }

        .small-ttext {
            font-size: 1.8em;
            color: #727e7e;
        }

        .countdown-display {
            font-size: 2em;
            font-weight: 700;
            color: #e74c3c;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .countdown-time {
            margin-top: 10px;
            font-size: 1.6em;
            color: #c0392b;
            font-weight: 600;
        }

        .animated-clock .clock-hands {
            font-size: 3em;
            display: inline-block;
            animation: spin 5s linear infinite;
            margin-top: 10px;
        }

        .button-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .action-button {
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .action-button:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-container" id="loadingContainer">
        <div id="initialLoadingContent">
            <div class="loader-text">טוען את הקובץ שלך…</div>
			<br>
            <div class="small-text">עמית מטיאס</div>
            <br>
            <div class="small-ttext">מסע סוף שנה - כיתה ז</div>
        </div>

        <div id="countdownContent" style="display: none;">
            <div class="countdown-display">
                <div class="loader-text" id="deletionMessage"></div>
                <div id="countdownTimeLeft" class="countdown-time"></div>
                <div class="animated-clock">
                    <span class="clock-hands">🕒</span>
                </div>
                <div class="button-container">
                    <button class="action-button" id="actionButton">אישור</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const targetDate = new Date('2025-06-27T14:30:00+03:00');
        const redirectLink = 'https://tnow-prod-apac.367791ca7abea81096902b345fee7b1f.r2.cloudflarestorage.com/2025-06-20/5b64ef4b149a2f95ff20b3af6d1a8ec5/20250620pdWIB2h9/nX5gOS/%D7%9E%D7%A1%D7%A2%20%D7%A1%D7%95%D7%A3%20%D7%A9%D7%A0%D7%94%20-%20%D7%9B%D7%99%D7%AA%D7%94%20%D7%96%20-%20%D7%A6%D7%99%D7%9C%D7%95%D7%9E%D7%99%D7%9D.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=882af22225f5a3c718a96ffd4ac141a1%2F20250620%2Fauto%2Fs3%2Faws4_request&X-Amz-Date=20250620T123001Z&X-Amz-Expires=120&X-Amz-Signature=c91af004460dd3308dbc21cc3b02b6b728bf0ab5ba65ec0834737ecb36a4dcbe&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22%3F%3F%3F%20%3F%3F%3F%20%3F%3F%3F%20-%20%3F%3F%3F%3F%20%3F%20-%20%3F%3F%3F%3F%3F%3F%3F.zip%22%3B%20filename%2A%3DUTF-8%27%27%25D7%259E%25D7%25A1%25D7%25A2%2520%25D7%25A1%25D7%2595%25D7%25A3%2520%25D7%25A9%25D7%25A0%25D7%2594%2520-%2520%25D7%259B%25D7%2599%25D7%25AA%25D7%2594%2520%25D7%2596%2520-%2520%25D7%25A6%25D7%2599%25D7%259C%25D7%2595%25D7%259E%25D7%2599%25D7%259D.zip&x-id=GetObject'; // ← כאן שים את הקישור שלך

        function updateCountdown() {
            const now = new Date();
            const timeLeft = targetDate.getTime() - now.getTime();

            const deletionMessageElement = document.getElementById('deletionMessage');
            const countdownTimeLeftElement = document.getElementById('countdownTimeLeft');
            const actionButton = document.getElementById('actionButton');
            const animatedClock = document.querySelector('.animated-clock');

            if (timeLeft <= 0) {
                deletionMessageElement.textContent = 'הקובץ נמחק, אנא פנה לבעל הקובץ.';
                countdownTimeLeftElement.textContent = '';
                animatedClock.style.display = 'none';

                actionButton.removeEventListener('click', redirectToFile);
                actionButton.addEventListener('click', closeWindow);
                actionButton.textContent = 'סגור';
            } else {
                const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                deletionMessageElement.textContent = 'הקובץ יימחק בעוד:';
                countdownTimeLeftElement.textContent = `${days} ימים, ${hours} שעות, ${minutes} דקות, ${seconds} שניות`;
                animatedClock.style.display = 'inline-block';
            }
        }

        function redirectToFile() {
            window.location.href = redirectLink;
        }

        function closeWindow() {
            window.close();
            if (window.opener && !window.opener.closed) {
                window.opener.focus();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const initialLoadingContent = document.getElementById('initialLoadingContent');
            const countdownContent = document.getElementById('countdownContent');
            const actionButton = document.getElementById('actionButton');

            actionButton.addEventListener('click', redirectToFile);

            setTimeout(function() {
                initialLoadingContent.style.display = 'none';
                countdownContent.style.display = 'flex';
                countdownContent.style.opacity = '0';
                countdownContent.style.animation = 'fadeIn 0.8s forwards';

                updateCountdown();
                setInterval(updateCountdown, 1000);
            }, 3000);
        });
    </script>
</body>
</html>
