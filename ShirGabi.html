<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הגדרות הדפסה</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            font-family: 'Heebo', sans-serif;
            color: #2c3e50;
            direction: rtl;
            text-align: center;
            overflow: hidden;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px 60px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 90%;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s forwards;
            position: relative;
        }

        .loading-text {
            font-size: 2.8em;
            font-weight: 700;
            margin-bottom: 20px;
            color: #34495e;
        }

        .small-text {
            font-size: 1.1em;
            color: #7f8c8d;
        }
        
        .initial-prompt {
            opacity: 0;
            animation: fadeIn 0.8s forwards;
            animation-delay: 0.5s;
        }

        .initial-prompt-buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .prompt-button {
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        
        .prompt-button.no {
            background-color: #e74c3c;
        }
        
        .prompt-button:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
        }
        
        .prompt-button.no:hover {
            background-color: #c0392b;
        }
        
        .main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .title {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 30px;
            color: #34495e;
        }
        
        .main-buttons-container {
            display: flex;
            gap: 40px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 250px;
            text-align: center;
        }

        .action-button {
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
        }

        .action-button:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
        }

        .conditions-button {
            background-color: #95a5a6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 400;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }
        
        .conditions-button:hover {
            background-color: #7f8c8d;
        }
        
        .conditions-box {
            display: none;
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: right;
            width: 100%;
        }

        .conditions-box p {
            margin: 5px 0;
            font-size: 1em;
            color: #34495e;
        }
        
        .accept-button {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s ease;
            display: none;
        }

        .accept-button:hover {
            background-color: #27ae60;
        }
        
        .print-button {
            background-color: #e67e22;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: none;
        }
        
        .print-button:hover {
            background-color: #d35400;
            transform: translateY(-3px);
        }

        .overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
            backdrop-filter: blur(5px);
        }

        .popup {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            font-size: 1.2em;
            color: #34495e;
        }
        
        .popup-close {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
        }

        /* אנימציות */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div id="initialPrompt" class="initial-prompt">
        <div class="loading-text">היי, אבא</div>
        <div class="small-text">אשמח שתדפיס את הקבצים הבאים</div>
        <div class="initial-prompt-buttons">
            <button class="prompt-button" onclick="showMainContent()">כן</button>
            <button class="prompt-button no" onclick="window.close()">לא</button>
        </div>
    </div>
    
    <div id="mainContent" class="main-content">
        <div class="title">בחר את סוג ההדפסה:</div>
        
        <div class="main-buttons-container">
            <div class="action-group" data-filename="ShirGabi/ספרון 1.pdf">
                <button class="action-button" onclick="handleFileAction(this, 'view')">ספרון 1</button>
                <button class="conditions-button" onclick="toggleConditions(this)">הצג תנאי הדפסה</button>
                <div class="conditions-box">
                    <p><strong>גודל דף:</strong> A4</p>
                    <p><strong>סוג צבע:</strong> שחור-לבן</p>
                    <p><strong>דו״צ:</strong> כן</p>
                    <button class="accept-button" onclick="acceptConditions(this)">קראתי ואני מאשר</button>
                </div>
                <button class="print-button" onclick="handleFileAction(this, 'print')">להדפסה</button>
            </div>
            
            <div class="action-group" data-filename="ShirGabi/כריכה + סיום.pdf">
                <button class="action-button" onclick="handleFileAction(this, 'view')">כריכה + סיום</button>
                <button class="conditions-button" onclick="toggleConditions(this)">הצג תנאי הדפסה</button>
                <div class="conditions-box">
                    <p><strong>גודל דף:</strong> A4</p>
                    <p><strong>סוג צבע:</strong> צבע</p>
                    <p><strong>דו״צ:</strong> לא</p>
                    <button class="accept-button" onclick="acceptConditions(this)">קראתי ואני מאשר</button>
                </div>
                <button class="print-button" onclick="handleFileAction(this, 'print')">להדפסה</button>
            </div>
        </div>
    </div>
    
    <div class="overlay" id="popupOverlay">
        <div class="popup" id="popup">
            <p id="popupMessage"></p>
            <button class="popup-close" onclick="closePopup()">אישור</button>
        </div>
    </div>
</div>

<script>
    function showMainContent() {
        const initialPrompt = document.getElementById('initialPrompt');
        const mainContent = document.getElementById('mainContent');
        
        initialPrompt.style.animation = 'fadeOut 0.5s forwards';
        
        setTimeout(() => {
            initialPrompt.style.display = 'none';
            mainContent.style.display = 'flex';
            mainContent.style.animation = 'fadeIn 0.8s forwards';
        }, 500);
    }
    
    function handleFileAction(button, actionType) {
        const actionGroup = button.closest('.action-group');
        const filename = actionGroup.dataset.filename;
        
        if (actionType === 'view') {
            const accepted = actionGroup.dataset.accepted === 'true';
            if (!accepted) {
                showPopup('חובה לאשר את התקנון לפני פתיחת הקובץ.');
                return;
            }
            window.open(filename, '_blank');
        } else if (actionType === 'print') {
            const accepted = actionGroup.dataset.accepted === 'true';
            if (!accepted) {
                showPopup('חובה לאשר את התקנון לפני הדפסת הקובץ.');
                return;
            }
            
            // יצירת iframe נסתרת להפעלת חלון ההדפסה של הדפדפן
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = filename;
            document.body.appendChild(iframe);
            
            iframe.onload = () => {
                iframe.contentWindow.print();
                setTimeout(() => {
                    document.body.removeChild(iframe);
                }, 1000);
            };
        }
    }

    function toggleConditions(button) {
        const actionGroup = button.closest('.action-group');
        const conditionsBox = actionGroup.querySelector('.conditions-box');
        const acceptButton = actionGroup.querySelector('.accept-button');
        const isVisible = conditionsBox.style.display === 'block';

        if (isVisible) {
            conditionsBox.style.display = 'none';
            acceptButton.style.display = 'none';
        } else {
            conditionsBox.style.display = 'block';
            acceptButton.style.display = 'block';
        }
    }
    
    function acceptConditions(button) {
        const actionGroup = button.closest('.action-group');
        const conditionsBox = actionGroup.querySelector('.conditions-box');
        const printButton = actionGroup.querySelector('.print-button');
        
        // סמן שהתנאים אושרו
        actionGroup.dataset.accepted = 'true';
        
        // הסתר את תיבת התנאים והצג את כפתור ההדפסה
        conditionsBox.style.display = 'none';
        printButton.style.display = 'block';
    }
    
    function showPopup(message) {
        const popupOverlay = document.getElementById('popupOverlay');
        const popupMessage = document.getElementById('popupMessage');
        popupMessage.innerText = message;
        popupOverlay.style.display = 'flex';
        popupOverlay.style.opacity = '0';
        setTimeout(() => {
            popupOverlay.style.opacity = '1';
        }, 10);
    }
    
    function closePopup() {
        const popupOverlay = document.getElementById('popupOverlay');
        popupOverlay.style.opacity = '0';
        setTimeout(() => {
            popupOverlay.style.display = 'none';
        }, 300);
    }
</script>

</body>
</html>
